system_node:
  ros__parameters:
    use_sim_time: false
    update_frequency: 10.0

    # LOCALIZADOR (Sustituye a nav2_amcl)
    # Usa un plugin que implementa AMCL dentro de EasyNav.
    localizer_id: "AMCLLocalizer"
    localizer_plugin: "easynav_navmap_localizer/AMCLLocalizer"

    AMCLLocalizer:
      plugin: "easynav_navmap_localizer/AMCLLocalizer"
      
      num_particles: 500         
      initial_pose:
        x: 0.0
        y: 0.0
        yaw: 0.0
        std_dev_xy: 0.3
        std_dev_yaw: 0.2
      
      # Configuración de ruido (Odom)
      noise_translation: 0.05
      noise_rotation: 0.05
      
      # ¿Usar TF o Topic? Default es false (usa topic /odom)
      compute_odom_from_tf: false



    # PLANIFICADOR
    planner_id: "GridPlanner"   # Algoritmo Dijkstra en una cuadrícula
    # Otras posibilidades son "RapidlyExploringRandomTree" o "BreadthFirstSearch"
    planner_plugin: "easynav_plugins::GridPlanner" 

    # EL CONTROLADOR (Local Planner)
    controller_id: "VectorPursuit"  # Algoritmo tipo follow-the-carrot
    # Otras posibilidades son "DynamicWindowApproach" o "PID simple"
    controller_plugin: "easynav_plugins::VectorPursuitController"

    # Parámetros específicos del Controlador (VectorPursuit)
    VectorPursuit:
      desired_linear_vel: 0.5   # Velocidad máxima (m/s)
      lookahead_dist: 0.6       # "Mira" 60cm por delante de la línea
      rotation_correction_threshold: 0.5 # Si el error de ángulo es grande, gira en el sitio
      max_angular_vel: 1.0      # Velocidad de giro máxima (rad/s)

    # Parámetros del Robot
    robot_radius: 0.25          # Radio del robot para no chocar



# GESTOR DE SENSORES (Sustituye a nav2_sensor_bridge)
# Traduce los datos de los sensores al formato que EasyNav entiende
# Necesario para que el localizador funcione. Crea una nube de puntos a partir del LIDAR.
sensors_node:
  ros__parameters:
    use_sim_time: false
    # Definimos qué sensores tenemos
    sensor_types: ["lidar"]

    # Configuración del "traductor"
    lidar:
      # NOTA: Este nombre de plugin es una suposición estándar en EasyNav. 
      # Si falla, necesitaremos buscar el README de easynav_sensors.
      plugin: "easynav_extra_plugins/LaserScanSensor" 
      sensor_topic: "/scan"  # Tu topic real
      sensor_frame: "lidar_link"







# GESTOR DE MAPAS (Sustituye a nav2_map_server)

maps_manager_node:
  ros__parameters:
    use_sim_time: false

    map_types: ["NavMapMapsManager"]

    # Configuración del NavMap
    NavMapMapsManager:
      plugin: "easynav_navmap_maps_manager/NavMapMapsManager"
      
      # El nombre del paquete donde está el mapa
      package: "diablo_test" 
      
      # Ruta relativa dentro del paquete
      occmap_path_file: "maps/mapa_tfg.yaml" 
      
      # Frecuencia de publicación
      freq: 5.0
      
      # Filtros opcionales
      filters: ["inflation"]

      # 2. Definimos la configuración de ese filtro
      inflation:
        plugin: "easynav_navmap_maps_manager/NavMapMapsManager/InflationFilter"
        inflation_radius: 0.2       # Radio de inflado
        cost_scaling_factor: 3.0    # Cómo cae el coste con la distancia
        inscribed_radius: 0.3       # Radio de seguridad crítico